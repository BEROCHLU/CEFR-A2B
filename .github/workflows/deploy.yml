name: cefr-a2b-deploy

on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: FTP-Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: 🗂️ Prepare deploy bundle
        run: |
          mkdir -p deploy
          cp -r dist deploy/dist
          cp -r prompt deploy/prompt

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: g2.xrea.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./deploy/
          server-dir: ./public_html/cefr-a2b/
          exclude: |
            **/.git*
            **/.git*/**
            **/.htaccess
